<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0805">
<title>ONE AI BOOTH</title>
<style>
:root{
  --gold:#e3bd79;
  --cream:#fff0d0;
  --ink:#24150c;
  --glass:rgba(28,17,10,.48);
  --line:rgba(244,217,168,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{position:fixed;inset:0;background:#000;overflow:hidden}
.screen{display:none;position:absolute;inset:0;overflow:hidden;background:#000}
.screen.active{display:block}
.sceneVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#000}
.sceneShade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,11,5,.10),transparent 35%,transparent 75%,rgba(20,11,5,.20))}
.uiTop{position:absolute;z-index:80;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;pointer-events:none}
.iconBtn{pointer-events:auto;width:46px;height:46px;border:1px solid var(--line);border-radius:15px;background:rgba(31,20,13,.58);backdrop-filter:blur(10px);color:#fff4df;font-size:21px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.flowBack{position:absolute;z-index:90;top:max(14px,env(safe-area-inset-top));left:16px}
.hidden{display:none!important}

/* Kamera Fləş Effekti */
#flashEffect{position:absolute;inset:0;background:#fff;z-index:150;opacity:0;pointer-events:none;transition:opacity .12s ease-out}
#flashEffect.flash{opacity:.95;transition:none}

/* Screen 1 */
#screen1 .tapAll{position:absolute;inset:0;z-index:20}
.startCopy{position:absolute;z-index:24;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:14px 28px;border:1px solid rgba(255,236,196,.4);border-radius:999px;background:rgba(28,17,10,.5);backdrop-filter:blur(10px);color:#fff0ce;font-size:clamp(14px,2.8vw,18px);font-weight:800;letter-spacing:.12em;white-space:nowrap;pointer-events:none}
.galleryBadge{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--gold);color:#25170d;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid #1a110b}

/* Screen 2 */
.styleHit{position:absolute;z-index:30;top:20%;bottom:14%;width:42%;border:0;background:transparent;color:transparent}
.styleHit.color{left:5%}
.styleHit.mono{right:5%}
.styleHint{position:absolute;z-index:29;bottom:max(5.5%,env(safe-area-inset-bottom) + 14px);padding:10px 20px;border-radius:999px;background:rgba(32,20,12,.65);border:1px solid rgba(244,217,168,.3);backdrop-filter:blur(8px);color:#f9e7c6;font:600 15px/1 Georgia,serif;letter-spacing:.03em;pointer-events:none}
.styleHint.color{left:12%}
.styleHint.mono{right:12%}

/* Green-screen Live Compositor */
.compositeStage{position:absolute;inset:0;z-index:10;width:100%;height:100%;display:block;background:#000;pointer-events:none}
.sourceScene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
.hiddenLive{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none}
.readyPhrase{position:absolute;z-index:70;left:50%;bottom:max(6%,env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) rotate(-1.5deg);color:#fff0c8;font-family:"Segoe Print","Bradley Hand","Brush Script MT",cursive;font-size:clamp(30px,6.2vw,56px);font-weight:700;font-style:italic;white-space:nowrap;text-shadow:0 2px 0 rgba(95,49,16,.86),0 8px 20px rgba(0,0,0,.45);pointer-events:none}
.readyPhrase:after{content:"";position:absolute;left:10%;right:10%;bottom:-8px;height:3px;border-radius:50%;background:linear-gradient(90deg,#b75a40,#d8b45f,#678372)}

.countdownOverlay{position:absolute;z-index:75;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.countBubble{position:relative;width:110px;height:110px;display:grid;place-items:center;border-radius:50%;background:rgba(24,15,9,.45);border:2px solid rgba(248,222,174,.95);box-shadow:0 12px 34px rgba(0,0,0,.35)}
.countNum{font-family:"Segoe Print","Bradley Hand",cursive;font-size:66px;font-weight:800;color:#fff3d4;text-shadow:0 4px 14px rgba(0,0,0,.5)}
@keyframes countPop{0%{transform:scale(.5);opacity:.2}55%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}

/* Molbert üzərində təbii kətan yerləşimi (Screen 5 & Screen 6) */
.easelContainer{position:absolute;z-index:20;left:50.8%;top:48.2%;transform:translate(-50%,-50%);width:min(55vw,310px);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 35px rgba(0,0,0,.5)}
.easelPhoto{width:100%;height:100%;object-fit:cover;border-radius:2px;border:3px solid #f7ecd7;box-shadow:inset 0 0 15px rgba(0,0,0,.3)}

/* Screen 5 Review Actions */
.reviewActions{position:absolute;z-index:60;left:50%;bottom:max(20px,env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);width:min(90%,480px);display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px;border-radius:20px;background:rgba(25,15,9,.65);backdrop-filter:blur(12px)}
.reviewActions button{min-height:54px;border-radius:14px;font-size:14px;font-weight:800;letter-spacing:.04em}
.retake{border:1px solid rgba(232,197,146,.4);background:rgba(44,30,21,.92);color:#fff1dc}
.continue{border:0;background:var(--gold);color:#28190f}

/* Screen 6 Processing */
.processingCopy{position:absolute;z-index:60;left:50%;bottom:max(28px,env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);width:min(86%,560px);text-align:center;color:#fff0d2;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.processingCopy h2{margin:0 0 12px;font:italic 600 clamp(26px,5.5vw,44px)/1 Georgia,serif}
.progress{height:7px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.progressBar{height:100%;width:0;background:linear-gradient(90deg,#c85d43,#d9b35b,#608477);transition:width .1s linear}
.processingTime{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.12em}

/* Screen 7 Final Photo Frame */
.finalFrameWrapper{position:absolute;z-index:25;left:50%;top:44%;transform:translate(-50%,-50%);width:min(57vw,340px);aspect-ratio:3/4;border:8px solid #6b401d;outline:3px solid #d4a961;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;background:#18100a}
.finalPhoto{width:100%;height:100%;object-fit:cover;display:block}

.finalPanel{position:absolute;z-index:60;left:50%;bottom:max(22px,env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);width:min(92%,560px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px;border-radius:19px;background:rgba(26,16,10,.65);backdrop-filter:blur(14px)}
.finalPanel button{min-height:52px;border-radius:12px;border:1px solid rgba(237,204,155,.35);font-weight:800;font-size:13px}
.finalPanel .print{background:var(--gold);color:#28190f;border:0}
.finalPanel .qr{background:rgba(255,248,232,.95);color:#28190f}
.finalPanel .finish{background:rgba(44,30,20,.95);color:#fff0d7}

/* Gallery/Admin */
.galleryScreen{background:linear-gradient(180deg,#17100b,#0b0805)}
.galleryWrap{position:absolute;inset:78px 16px 16px;overflow:auto;padding-bottom:30px}
.galleryTitle{font:italic 600 32px/1 Georgia,serif;color:#f4dbad;margin:5px 0 18px}
.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.galleryItem{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#24170f;border:1px solid rgba(230,198,147,.25)}
.galleryItem img{width:100%;height:100%;object-fit:cover}
.galleryEmpty{opacity:.65;font-size:14px}
.modal{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.adminCard{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#15100c;border:1px solid rgba(239,206,153,.22);border-radius:22px;padding:22px}
.adminHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.adminHead h2{margin:0;font:600 28px Georgia,serif;color:#f1d8aa}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#ddc49e}
.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #433225;background:#0e0a07;color:#fff}
.note{font-size:11px;line-height:1.4;opacity:.65}
.adminActions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.adminActions button,.saveBtn,.cancelBtn{padding:12px 18px;border-radius:11px;font-weight:800}
.saveBtn{border:0;background:var(--gold);color:#27180e}
.cancelBtn{border:1px solid #493628;background:#21160f;color:#fff}
.smallCard{width:min(400px,92vw);background:#17100b;border:1px solid rgba(239,206,153,.25);border-radius:20px;padding:20px;text-align:center}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0}
.qty button{width:48px;height:48px;border-radius:12px;border:1px solid #514035;background:#251910;color:#fff;font-size:26px}
.qty strong{font-size:32px}

@media(max-width:600px){
  .styleHint{font-size:13px}
  .countBubble{width:90px;height:90px}.countNum{font-size:56px}
  .adminGrid{grid-template-columns:1fr}.field.full{grid-column:auto}
}
</style>
</head>
<body>
<div class="app">

<div id="flashEffect"></div>

<section class="screen active" id="screen1">
  <video class="sceneVideo" id="welcomeVideo" autoplay muted loop playsinline preload="auto" src="assets/01_welcome.MP4"></video>
  <div class="sceneShade"></div>
  <div class="uiTop">
    <button class="iconBtn" id="galleryBtn">▣<span class="galleryBadge" id="galleryBadge">0</span></button>
    <button class="iconBtn" id="adminBtn">⚙</button>
  </div>
  <div class="startCopy" id="touchText">BAŞLAMAQ ÜÇÜN TOXUN</div>
  <div class="tapAll" id="welcomeTap"></div>
</section>

<section class="screen" id="screen2">
  <video class="sceneVideo" id="styleVideo" muted loop playsinline preload="auto" src="assets/02_style_select.mov"></video>
  <div class="sceneShade"></div>

  <button class="styleHit color" data-style="color" aria-label="Rəngli portret"></button>

  <div class="styleHint mono" id="monoLabel">Qara-ağ</div>

  <canvas class="compositeStage" id="stage3" width="512" height="910"></canvas>
  <video class="sourceScene" id="readyBase" muted loop playsinline preload="auto" src="assets/03_ready_countdown.MP4"></video>
  <video class="hiddenLive" id="live3" autoplay muted playsinline></video>
  <div class="readyPhrase" id="readyPhrase">Hazırsansa başla</div>
</section>

<section class="screen" id="screen4">
  <canvas class="compositeStage" id="stage4" width="512" height="910"></canvas>
  <video class="sourceScene" id="countBase" muted loop playsinline preload="auto" src="assets/04_countdown_capture.MP4"></video>
  <video class="hiddenLive" id="live4" autoplay muted playsinline></video>
  <div class="countdownOverlay" id="countdownOverlay">
    <div class="countBubble"><span class="countNum" id="countNum">4</span></div>
  </div>

<section class="screen" id="screen5">
  <video class="sceneVideo" id="reviewVideo" muted loop playsinline preload="auto" src="assets/05_capture_review.mov"></video>
  <div class="sceneShade"></div>

  <div class="easelContainer">
    <img class="easelPhoto" id="reviewImage" alt="Kamera görüntüsü">
  </div>
  <div class="reviewActions" id="reviewActions">
    <button class="retake" id="retakeBtn">YENİDƏN ÇƏK</button>
    <button class="continue" id="continueBtn">DAVAM ET</button>
  </div>
</section>

<section class="screen" id="screen6">
  <video class="sceneVideo" id="generatingVideo" muted loop playsinline preload="auto" src="assets/06_generating.MP4"></video>
  <div class="sceneShade"></div>
  <button class="iconBtn flowBack" id="backProcessing">‹</button>
  <div class="easelContainer">
    <img class="easelPhoto" id="processingImage" alt="Portret hazırlanır">
  </div>
  <div class="processingCopy">
    <h2 id="processingTitle">Portretin hazırlanır</h2>
    <div class="progress"><div class="progressBar" id="progressBar"></div></div>
    <div class="processingTime" id="processingTime">0%</div>
  </div>
</section>

<section class="screen" id="screen7">
  <video class="sceneVideo" id="finalVideo" muted loop playsinline preload="auto" src="assets/07_final_result.MP4"></video>
  <div class="sceneShade"></div>
  <button class="iconBtn flowBack" id="backFinal">‹</button>
  <div class="finalFrameWrapper">
    <img class="finalPhoto" id="finalPhoto" alt="Final portret">
  </div>
  <div class="finalPanel">
    <button class="print" id="printBtn">ÇAP ET</button>
    <button class="qr" id="qrBtn">QR</button>
    <button class="finish" id="finishBtn">BİTİR</button>
  </div>
</section>

<section class="screen galleryScreen" id="galleryScreen">
  <button class="iconBtn flowBack" id="galleryBack">‹</button>
  <div class="galleryWrap">
    <div class="galleryTitle" id="galleryTitle">Event qalereyası</div>
    <div class="galleryEmpty" id="galleryEmpty">Hələ şəkil yoxdur.</div>
    <div class="galleryGrid" id="galleryGrid"></div>

</section>

<div class="modal" id="adminModal">
  <div class="adminCard">
    <div class="adminHead"><h2>Operator Menyu</h2><button class="iconBtn" id="adminClose">×</button></div>
    <div class="adminGrid">
      <div class="field"><label>Event adı</label><input id="eventName" value="ONE EVENTS"></div>
      <div class="field"><label>Qonaq dili</label><select id="guestLanguage"><option value="az">Azərbaycan</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select></div>
      <div class="field"><label>Kamera</label><select id="cameraMode"><option value="webcam">Web Camera</option><option value="canon-1100d">Canon EOS 1100D</option><option value="canon-600d">Canon EOS 600D</option><option value="canon-650d">Canon EOS 650D</option></select><div class="note">Canon üçün Windows ONE Booth Helper lazımdır.</div></div>
      <div class="field"><label>Printer</label><select id="printerMode"><option value="dnp-rx1">DNP RX1</option><option value="dnp-rx1hs">DNP RX1HS</option><option value="epson-l8050">Epson L8050</option></select></div>
      <div class="field full"><label>PNG Çərçivə (Frame overlay)</label><input id="frameInput" type="file" accept="image/png"></div>
      <div class="field"><label>QR Rejimi</label><select id="qrMode"><option value="on">Açıq (ON)</option><option value="off">Bağlı (OFF)</option></select></div>
    </div>
    <div class="adminActions"><button class="cancelBtn" id="adminCancel">BAĞLA</button><button class="saveBtn" id="adminSave">YADDA SAXLA</button></div>

  <div class="smallCard">
    <button class="iconBtn" id="printClose">×</button>
    <h3>Çap sayı</h3>
    <div class="qty"><button id="qtyMinus">−</button><strong id="qtyValue">1</strong><button id="qtyPlus">+</button></div>
    <button class="saveBtn" id="printConfirm">ÇAP ET</button>
    <div class="note" id="printStatus"></div>
  </div>
</div>

<canvas id="captureCanvas" width="1200" height="1800" class="hidden"></canvas>
<canvas id="finalCanvas" width="1200" height="1800" class="hidden"></canvas>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const screens=['screen1','screen2','screen3','screen4','screen5','screen6','screen7','galleryScreen'];
let settings={eventName:'ONE EVENTS',guestLanguage:'az',cameraMode:'webcam',printerMode:'dnp-rx1hs',qrMode:'on'};
let stream=null,selectedStyle='color',rawData='',finalData='',frameData='',counting=false,flowToken=0,printCopies=1;
let gallery=[];
let idleTimer=null;

function kickIdle(){
 clearTimeout(idleTimer);
 const cur=document.querySelector('.screen.active')?.id;
 if(cur && cur!=='screen1'){
   idleTimer=setTimeout(()=>{
     reset();
   }, 45000);
 }
}
window.addEventListener('pointerdown',kickIdle);

const TXT={
 az:{touch:'BAŞLAMAQ ÜÇÜN TOXUN',color:'Rəngli',mono:'Qara-ağ',ready:'HAZIRSANSA BAŞLA',retake:'YENİDƏN ÇƏK',cont:'DAVAM ET',processing:'Portretin hazırlanır',print:'ÇAP ET',finish:'BİTİR',gallery:'Event qalereyası',empty:'Hələ şəkil yoxdur.'},
 en:{touch:'TOUCH TO START',color:'Color',mono:'Black & White',ready:"READY? LET'S GO",retake:'RETAKE',cont:'CONTINUE',processing:'Creating portrait...',print:'PRINT',finish:'FINISH',gallery:'Event Gallery',empty:'No photos yet.'},
 tr:{touch:'BAŞLAMAK İÇİN DOKUN',color:'Renkli',mono:'Siyah-beyaz',ready:'HAZIRSAN BAŞLA',retake:'TEKRAR ÇEK',cont:'DEVAM ET',processing:'Portren hazırlanıyor',print:'YAZDIR',finish:'BİTİR',gallery:'Etkinlik Galerisi',empty:'Henüz fotoğraf yok.'},
 ru:{touch:'КОСНИСЬ ДЛЯ СТАРТА',color:'Цветная',mono:'Чёрно-белая',ready:'ГОТОВЫ? НАЧНЁМ',retake:'ПЕРЕСНЯТЬ',cont:'ПРОДОЛЖИТЬ',processing:'Создаём портрет',print:'ПЕЧАТЬ',finish:'ГОТОВО',gallery:'Галерея события',empty:'Фотографий пока нет.'}
};
const t=k=>(TXT[settings.guestLanguage]||TXT.az)[k]||k;

function applyLanguage(){
 $('touchText').textContent=t('touch');
 $('colorLabel').textContent=t('color');
 $('monoLabel').textContent=t('mono');
 $('readyPhrase').textContent=t('ready');
 $('retakeBtn').textContent=t('retake');
 $('continueBtn').textContent=t('cont');
 $('processingTitle').textContent=t('processing');
 $('printBtn').textContent=t('print');
 $('finishBtn').textContent=t('finish');
 $('galleryTitle').textContent=t('gallery');
 $('galleryEmpty').textContent=t('empty');
}

const videoByScreen={
 screen1:['welcomeVideo'],
 screen2:['styleVideo'],
 screen3:['readyBase'],
 screen4:['countBase'],
 screen5:['reviewVideo'],
 screen6:['generatingVideo'],
 screen7:['finalVideo']
};

function show(id){
 screens.forEach(s=>$(s).classList.toggle('active',s===id));
 Object.entries(videoByScreen).forEach(([sid,ids])=>{
   ids.forEach(vId=>{
     const v=$(vId); if(!v)return;
     if(sid===id){
       try{v.currentTime=0}catch(e){}
       v.play().catch(()=>{});
     }else{
       v.pause();
     }
   });
 });
 kickIdle();
}

/* ---------- GREEN-SCREEN LIVE COMPOSITOR (512x910) ---------- */
const W=512,H=910;
const Q={tl:[118,244],tr:[403,246],br:[391,621],bl:[114,625]};
const workScene=document.createElement('canvas');
const workCam=document.createElement('canvas');
workScene.width=workCam.width=W;workScene.height=workCam.height=H;
const sceneCtx=workScene.getContext('2d',{willReadFrequently:true});
const camCtx=workCam.getContext('2d',{willReadFrequently:true});

function isGreen(r,g,b){
 return g>85 && g>r*1.20 && g>b*1.16 && (g-Math.max(r,b))>26;
}
function drawCameraCover(video){
 const sw=video.videoWidth,sh=video.videoHeight;
 if(!sw||!sh)return false;
 const sc=Math.max(W/sw,H/sh),cw=W/sc,ch=H/sc,sx=(sw-cw)/2,sy=(sh-ch)/2;
 camCtx.clearRect(0,0,W,H);
 camCtx.save();camCtx.translate(W,0);camCtx.scale(-1,1);
 camCtx.drawImage(video,sx,sy,cw,ch,0,0,W,H);
 camCtx.restore();
 return true;
}
function lerp(a,b,t){return a+(b-a)*t}
function renderGreenStage(stageId,sceneVideo,liveVideo){
 const stage=$(stageId);
 if(!stage||!sceneVideo||sceneVideo.readyState<2||!liveVideo||liveVideo.readyState<2)return;
 if(!drawCameraCover(liveVideo))return;

 const out=stage.getContext('2d',{willReadFrequently:true});
 sceneCtx.clearRect(0,0,W,H);
 sceneCtx.drawImage(sceneVideo,0,0,W,H);
 const scene=sceneCtx.getImageData(0,0,W,H);
 const cam=camCtx.getImageData(0,0,W,H);
 const d=scene.data,cd=cam.data;

 const topY=244,botY=625;
 for(let y=topY;y<=botY;y++){
   const v=(y-topY)/(botY-topY);
   const lx=lerp(Q.tl[0],Q.bl[0],v);
   const rx=lerp(Q.tr[0],Q.br[0],v);
   const x0=Math.max(0,Math.floor(lx)),x1=Math.min(W-1,Math.ceil(rx));
   const span=Math.max(1,rx-lx);
   for(let x=x0;x<=x1;x++){
     const p=(y*W+x)*4;
     if(!isGreen(d[p],d[p+1],d[p+2]))continue;
     const u=Math.max(0,Math.min(1,(x-lx)/span));
     const sx=Math.max(0,Math.min(W-1,Math.round(u*(W-1))));
     const sy=Math.max(0,Math.min(H-1,Math.round(v*(H-1))));
     const sp=(sy*W+sx)*4;
     d[p]=cd[sp];d[p+1]=cd[sp+1];d[p+2]=cd[sp+2];d[p+3]=255;
   }
 }
 out.putImageData(scene,0,0);
}
function compositorLoop(){
 const active=document.querySelector('.screen.active')?.id;
 if(active==='screen3')renderGreenStage('stage3',$('readyBase'),$('live3'));
 if(active==='screen4')renderGreenStage('stage4',$('countBase'),$('live4'));
 requestAnimationFrame(compositorLoop);
}
requestAnimationFrame(compositorLoop);

function stopCamera(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 $('live3').srcObject=null;$('live4').srcObject=null;
}
async function startCamera(){
 if(String(settings.cameraMode).startsWith('canon-')){
   alert('Canon üçün Windows ONE Booth Helper lazımdır.');
   throw new Error('Canon helper required');
 }
 stopCamera();
 stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},
   audio:false
 });
 $('live3').srcObject=stream;
 $('live4').srcObject=stream;
 await Promise.allSettled([$('live3').play(),$('live4').play()]);
 const t0=performance.now();
 while((!$('live3').videoWidth||!$('live4').videoWidth) && performance.now()-t0<2500){
   await new Promise(r=>setTimeout(r,50));
 }
}

async function openReady(){
 try{
   await startCamera();
   show('screen3');
 }catch(e){
   show('screen3');
 }
}

async function doCountdown(){
 if(counting||!stream)return;
 const token=++flowToken;
 counting=true;

 const continueAt=$('readyBase').currentTime||0;
 show('screen4');
 try{
   $('countBase').currentTime=continueAt;
   await $('countBase').play();
 }catch(e){}

 const t0=performance.now();
 while((!$('live4').videoWidth||!$('live4').videoHeight) && performance.now()-t0<2500){
   await new Promise(r=>setTimeout(r,50));
 }
 if(token!==flowToken){counting=false;return}

 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 $('countdownOverlay').style.display='flex';

 for(let n=3;n>=1;n--){
   if(token!==flowToken){counting=false;$('countdownOverlay').style.display='none';return}
   $('countNum').textContent=n;
   $('countNum').style.animation='none'; void $('countNum').offsetWidth;
   $('countNum').style.animation='countPop .72s cubic-bezier(.18,.8,.22,1)';
   await new Promise(r=>setTimeout(r,1000));
 }
 if(token!==flowToken)return;
 $('countdownOverlay').style.display='none';
 counting=false;
 
 const flash=$('flashEffect');
 flash.classList.add('flash');
 setTimeout(()=>flash.classList.remove('flash'), 140);
 
 capture();
}

function capture(){
 const v=$('live4'),c=$('captureCanvas'),ctx=c.getContext('2d');
 const w=1200,h=1800,sw=v.videoWidth,sh=v.videoHeight;
 if(!sw||!sh){alert('Kamera görüntüsü hazır deyil.');return}
 const sc=Math.max(w/sw,h/sh),cw=w/sc,ch=h/sc,sx=(sw-cw)/2,sy=(sh-ch)/2;
 ctx.clearRect(0,0,w,h);
 ctx.save();ctx.translate(w,0);ctx.scale(-1,1);
 ctx.drawImage(v,sx,sy,cw,ch,0,0,w,h);
 ctx.restore();
 rawData=c.toDataURL('image/jpeg',.95);
 stopCamera();
 
 $('reviewImage').src=rawData;
 $('reviewImage').style.filter=selectedStyle==='mono'?'grayscale(1) contrast(1.2)':'none';
 show('screen5');
}

async function retake(){
 rawData='';
 $('reviewImage').removeAttribute('src');
 await openReady();
}

function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}

function applyArtFilter(ctx, w, h, style){
 const imgData=ctx.getImageData(0,0,w,h);
 const d=imgData.data;
 if(style==='mono'){
   for(let i=0;i<d.length;i+=4){
     let g=d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
     g=((g/255 - 0.5)*1.35 + 0.5)*255;
     g=Math.max(0,Math.min(255,g));
     d[i]=g; d[i+1]=g; d[i+2]=g;
   }
 }else{
   for(let i=0;i<d.length;i+=4){
     d[i]=Math.min(255, d[i]*1.08);
     d[i+1]=Math.min(255, d[i+1]*1.03);
     d[i+2]=Math.max(0, d[i+2]*0.94);
   }
 }
 ctx.putImageData(imgData,0,0);
}

async function composeFinal(){
 if(!rawData)return '';
 const base=await loadImage(rawData),c=$('finalCanvas'),ctx=c.getContext('2d');
 ctx.clearRect(0,0,1200,1800);
 ctx.drawImage(base,0,0,1200,1800);
 
 applyArtFilter(ctx, 1200, 1800, selectedStyle);

 if(frameData){
   try{const f=await loadImage(frameData);ctx.drawImage(f,0,0,1200,1800)}catch(e){}
 }
 return c.toDataURL('image/jpeg',.96);
}

async function continueFlow(){
 if(!rawData)return;
 const token=++flowToken;
 $('processingImage').src=rawData;
 $('progressBar').style.width='0%';
 $('processingTime').textContent='0%';
 
 $('processingImage').style.filter=selectedStyle==='mono'?'grayscale(1) contrast(1.3)':'contrast(1.1) saturate(1.15)';
 
 show('screen6');
 
 const total=2200,started=performance.now();
 await new Promise(resolve=>{
   const step=now=>{
     if(token!==flowToken){resolve();return}
     const p=Math.min(1,(now-started)/total);
     const pct=Math.round(p*100);
     $('progressBar').style.width=pct+'%';
     $('processingTime').textContent=pct+'%';
     if(p<1)requestAnimationFrame(step);else resolve();
   };
   requestAnimationFrame(step);
 });
 if(token!==flowToken)return;

 finalData=await composeFinal();
 gallery.unshift({raw:rawData,final:finalData||rawData,style:selectedStyle,id:Date.now().toString(36)});
 renderGallery();
 
 $('finalPhoto').src=finalData||rawData;
 show('screen7');
}

function reset(){
 ++flowToken;counting=false;stopCamera();rawData='';finalData='';
 $('countdownOverlay').style.display='none';
 show('screen1');
}

function renderGallery(){
 $('galleryBadge').textContent=gallery.length;
 $('galleryGrid').innerHTML='';
 $('galleryEmpty').style.display=gallery.length?'none':'block';
 gallery.forEach(item=>{
   const d=document.createElement('div');d.className='galleryItem';
   const i=document.createElement('img');i.src=item.final||item.raw;d.appendChild(i);
   $('galleryGrid').appendChild(d);
 });
}

function saveSettings(){
 settings.eventName=$('eventName').value.trim()||'ONE EVENTS';
 settings.guestLanguage=$('guestLanguage').value;
 settings.cameraMode=$('cameraMode').value;
 settings.printerMode=$('printerMode').value;
 settings.qrMode=$('qrMode').value;
 localStorage.setItem('one_ai_settings_v8',JSON.stringify(settings));
 applyLanguage();
 $('adminModal').classList.remove('open');
}

function loadSettings(){
 try{settings={...settings,...JSON.parse(localStorage.getItem('one_ai_settings_v8')||'{}')}}catch(e){}
 $('eventName').value=settings.eventName;
 $('guestLanguage').value=settings.guestLanguage;
 $('cameraMode').value=settings.cameraMode;
 $('printerMode').value=settings.printerMode;
 $('qrMode').value=settings.qrMode;
 applyLanguage();
}

$('frameInput').addEventListener('change',e=>{
 const f=e.target.files?.[0];if(!f)return;
 const r=new FileReader();r.onload=()=>frameData=r.result;r.readAsDataURL(f);
});

$('welcomeTap').onclick=()=>show('screen2');
$('backStyle').onclick=reset;
document.querySelectorAll('.styleHit').forEach(b=>b.onclick=()=>{selectedStyle=b.dataset.style;openReady()});
$('screen3').addEventListener('click',e=>{if(e.target.closest('button'))return;doCountdown()});
$('retakeBtn').onclick=retake;
$('continueBtn').onclick=continueFlow;
$('backReview').onclick=retake;
$('backProcessing').onclick=()=>{++flowToken;show('screen5')};
$('backFinal').onclick=()=>show('screen5');
$('finishBtn').onclick=reset;

$('galleryBtn').onclick=e=>{e.stopPropagation();renderGallery();show('galleryScreen')};
$('galleryBack').onclick=()=>show('screen1');
$('adminBtn').onclick=e=>{e.stopPropagation();$('adminModal').classList.add('open')};
$('adminClose').onclick=$('adminCancel').onclick=()=>$('adminModal').classList.remove('open');
$('adminSave').onclick=saveSettings;

$('printBtn').onclick=()=>{printCopies=1;$('qtyValue').textContent=1;$('printStatus').textContent='';$('printModal').classList.add('open')};
$('printClose').onclick=()=>$('printModal').classList.remove('open');
$('qtyMinus').onclick=()=>{$('qtyValue').textContent=printCopies=Math.max(1,printCopies-1)};
$('qtyPlus').onclick=()=>{$('qtyValue').textContent=printCopies=Math.min(20,printCopies+1)};
$('printConfirm').onclick=()=>{$('printStatus').textContent=`${settings.printerMode.toUpperCase()} üçün ${printCopies} nüsxə göndərildi.`};

$('qrBtn').onclick=()=>alert(settings.qrMode==='on'?'QR kod tezliklə aktiv olacaq.':'QR söndürülüb.');

window.addEventListener('pagehide',stopCamera);
loadSettings();renderGallery();$('welcomeVideo').play().catch(()=>{});
})();
</script>
</body>
